name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The entry chunk carries a content hash, so its name is how the job
    # that checks the live site knows whether it is looking at this build.
    outputs:
      entry: ${{ steps.entry.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, not the one commit a checkout takes by
          # default (PLAN.md M315a). `indexFresh.test.ts` regenerates
          # INDEX.md from `git log` and compares, and on a shallow clone the
          # log holds one commit — so the generated index had one row, the
          # committed one had 305, and the first red CI of this audit was a
          # test reporting the checkout rather than the tree.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Build before test, not after (PLAN.md M224). `perf.test.ts` and
      # `privacy.test.ts` read `dist/` — the budget and the promises about
      # the artefact a climber installs — and `dist/` is gitignored, so
      # testing first meant those suites had never once run in CI.
      - run: npm run build
      - run: npm test
      # The layout net, in a real browser (PLAN.md M293).
      #
      # jsdom has no layout engine, so every box the suite measures reads
      # zero and a nav pushed off the bottom of the screen looks perfectly
      # fine to all 6,910 tests. `scripts/layout.mjs` is the only thing that
      # can see it, and until now it ran when somebody remembered to run it.
      #
      # It gates the deploy because it is deterministic — three runs, three
      # byte-identical outputs, 49 routes × 3 sizes in 105 seconds — and
      # because the two worst bugs this app has shipped (M225, M269) were
      # both in the class it checks and were both found by a person on a
      # phone.
      #
      # `--no-save`, so `package.json` stays as `scripts/layout.mjs` says it
      # should: *"Playwright is not a dependency of the app … it is a tool
      # for the person publishing."* CI is the person publishing.
      - run: npm i --no-save playwright-core
      - run: npx playwright-core install --with-deps chromium
      - name: Layout
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ -o /dev/null && break
            if [ "$i" = 60 ]; then echo "preview never came up"; exit 1; fi
            sleep 1
          done
          npm run layout
      - id: entry
        run: |
          name=$(grep -oP 'assets/\Kindex-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$name" ]; then echo "no entry chunk in dist/index.html"; exit 1; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The same suite, as other days (PLAN.md M299).
  #
  # `today()` reads the clock, and a quarter of the test files build their
  # fixtures from it. Seven of them said one thing on the day they were
  # written and another on a Sunday — and the suite, green on every push for
  # two hundred milestones, was red on four days in seven and on most of the
  # calendar. Nothing in CI could see that, because CI only ever ran it as
  # the day it ran.
  #
  # Its own jobs rather than a step of `build`: it needs no `dist` and no
  # browser, so it runs beside the build instead of after it, and the deploy
  # waits on both. One runner per day, because ten days one after another is
  # twenty minutes in front of every deploy and ten at once is two — and the
  # days are independent by construction.
  days:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: echo "list=$(node scripts/dates.mjs --list)" >> "$GITHUB_OUTPUT"

  dates:
    needs: days
    strategy:
      # Every day reported, not the first one to go: which days fail is the
      # finding, and a run that stops at the earliest says nothing about the
      # shape of it.
      fail-fast: false
      matrix:
        day: ${{ fromJSON(needs.days.outputs.list) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:dates -- --day ${{ matrix.day }}

  deploy:
    needs: [build, dates]
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The app that is actually being served (PLAN.md M300).
  #
  # Everything above this runs against `dist` through `vite preview` — the
  # suite, the budget, the layout harness. That proves the artefact and says
  # nothing about whether it reached anybody, and between the two sit the
  # parts that go wrong quietly: the upload, the custom domain, the base
  # path, and a service worker that can keep serving a previous version.
  #
  # It gates nothing by construction, because it runs after the deploy. A
  # failure here is a report, which is the right blast radius for a check
  # whose first failure mode is a CDN being slow.
  live:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `npm ci`: the script needs a browser and nothing else the
      # manifest carries, and `--no-save` keeps it out of the manifest for
      # the reason `scripts/layout.mjs` gives.
      - run: npm i --no-save playwright-core
      - run: npx playwright-core install --with-deps chromium
      - name: The deployed app
        env:
          URL: ${{ needs.deploy.outputs.url }}
          ENTRY: ${{ needs.build.outputs.entry }}
        run: node scripts/live.mjs
