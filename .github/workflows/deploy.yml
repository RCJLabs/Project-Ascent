name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Build before test, not after (PLAN.md M224). `perf.test.ts` and
      # `privacy.test.ts` read `dist/` — the budget and the promises about
      # the artefact a climber installs — and `dist/` is gitignored, so
      # testing first meant those suites had never once run in CI.
      - run: npm run build
      - run: npm test
      # The layout net, in a real browser (PLAN.md M293).
      #
      # jsdom has no layout engine, so every box the suite measures reads
      # zero and a nav pushed off the bottom of the screen looks perfectly
      # fine to all 6,910 tests. `scripts/layout.mjs` is the only thing that
      # can see it, and until now it ran when somebody remembered to run it.
      #
      # It gates the deploy because it is deterministic — three runs, three
      # byte-identical outputs, 49 routes × 3 sizes in 105 seconds — and
      # because the two worst bugs this app has shipped (M225, M269) were
      # both in the class it checks and were both found by a person on a
      # phone.
      #
      # `--no-save`, so `package.json` stays as `scripts/layout.mjs` says it
      # should: *"Playwright is not a dependency of the app … it is a tool
      # for the person publishing."* CI is the person publishing.
      - run: npm i --no-save playwright-core
      - run: npx playwright-core install --with-deps chromium
      - name: Layout
        run: |
          npm run preview -- --port 4173 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:4173/ -o /dev/null && break
            if [ "$i" = 60 ]; then echo "preview never came up"; exit 1; fi
            sleep 1
          done
          npm run layout
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The same suite, as other days (PLAN.md M299).
  #
  # `today()` reads the clock, and a quarter of the test files build their
  # fixtures from it. Seven of them said one thing on the day they were
  # written and another on a Sunday — and the suite, green on every push for
  # two hundred milestones, was red on four days in seven and on most of the
  # calendar. Nothing in CI could see that, because CI only ever ran it as
  # the day it ran.
  #
  # Its own jobs rather than a step of `build`: it needs no `dist` and no
  # browser, so it runs beside the build instead of after it, and the deploy
  # waits on both. One runner per day, because ten days one after another is
  # twenty minutes in front of every deploy and ten at once is two — and the
  # days are independent by construction.
  days:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: echo "list=$(node scripts/dates.mjs --list)" >> "$GITHUB_OUTPUT"

  dates:
    needs: days
    strategy:
      # Every day reported, not the first one to go: which days fail is the
      # finding, and a run that stops at the earliest says nothing about the
      # shape of it.
      fail-fast: false
      matrix:
        day: ${{ fromJSON(needs.days.outputs.list) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:dates -- --day ${{ matrix.day }}

  deploy:
    needs: [build, dates]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
